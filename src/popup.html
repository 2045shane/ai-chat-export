<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI 聊天导出</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; width: 280px; }
      main { padding: 14px; }
      button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #176b4d; color: #fff; cursor: pointer; }
      p { margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <p><strong>AI 聊天导出</strong></p>
      <p>打开 grok.com 或 gemini.google.com 的对话页，点击页面上的「导出对话」。</p>
      <p>当前对话可随时导出。批量导出会依次打开勾选的可见对话，并下载一个只含 Markdown 的 zip。</p>
      <button id="options" type="button">打开许可码选项</button>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
